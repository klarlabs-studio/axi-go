name: Fuzz (nightly)

# Runs fuzz tests beyond the seed corpus to keep the harness productive.
# Seed inputs already execute on every PR via the regular test job; this
# workflow extends coverage with real fuzzing on a cron.

on:
  schedule:
    # Weekly Sun 02:17 UTC. Daily cron retired — seed corpus already runs
    # on every PR; weekly extended fuzz is sufficient + dispatch on demand.
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-toon:
    name: Fuzz toon.Encode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
      - name: Fuzz for 5 minutes
        run: go test ./toon -run=^$ -fuzz=FuzzEncode -fuzztime=5m
      - name: Upload new failing inputs (if any)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-toon
          path: toon/testdata/fuzz/FuzzEncode/
          if-no-files-found: ignore

  fuzz-domain:
    name: Fuzz domain validators + snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
      - name: Fuzz action names
        run: go test ./domain -run=^$ -fuzz=FuzzNewActionName -fuzztime=2m
      - name: Fuzz capability names
        run: go test ./domain -run=^$ -fuzz=FuzzNewCapabilityName -fuzztime=1m
      - name: Fuzz session snapshots
        run: go test ./domain -run=^$ -fuzz=FuzzSessionFromSnapshot -fuzztime=2m
      - name: Upload new failing inputs (if any)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-domain
          path: domain/testdata/fuzz/
          if-no-files-found: ignore
